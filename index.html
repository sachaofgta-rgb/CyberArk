<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Ark | Join Us</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #050505; /* Noir profond */
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .discord-btn {
            text-decoration: none;
            color: #ff0000; /* Rouge comme ton tool */
            font-size: 3rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 10px;
            padding: 20px 40px;
            border: 2px solid #ff0000;
            border-radius: 10px;
            transition: 0.4s;
            box-shadow: 0 0 15px #ff0000;
            position: relative;
        }

        .discord-btn:hover {
            background-color: #ff0000;
            color: #ffffff;
            box-shadow: 0 0 50px #ff0000, 0 0 100px #ff0000;
            transform: scale(1.1);
        }

        /* Petit effet de scanline en arrière-plan pour le style hack */
        body::before {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <a href="https://discord.gg/TON_LIEN" class="discord-btn">Discord</a>

</body>
</html>
